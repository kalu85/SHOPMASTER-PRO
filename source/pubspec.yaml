name: shopmaster_pro
description: SHOPMASTER PRO - billing, inventory, accounting and GST management for Android and Windows.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  file_picker: ^8.1.6
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0B1A33"
  adaptive_icon_foreground: "assets/logo_foreground.png"
