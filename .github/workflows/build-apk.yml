name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        run: test -f source/pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android folder
        working-directory: source
        run: flutter create --platforms=android --project-name shopmaster_pro --org com.shopmaster .

      - name: Ensure Android camera permission
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.CAMERA" />\\n'
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<manifest ', '<manifest ', 1)
              end = s.find('>') + 1
              s = s[:end] + '\\n' + permission + s[end:]
              p.write_text(s)
          print(p.read_text())
          PY

      - name: Get packages
        working-directory: source
        run: flutter pub get

      - name: Apply app icon (optional)
        working-directory: source
        run: |
          if [ -f assets/logo.png ] && [ -f assets/logo_foreground.png ]; then
            flutter pub add --dev flutter_launcher_icons || true
            printf '%s\n' 'flutter_launcher_icons:' '  android: true' '  ios: false' '  image_path: "assets/logo.png"' '  adaptive_icon_background: "#0B1A33"' '  adaptive_icon_foreground: "assets/logo_foreground.png"' > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons -f flutter_launcher_icons.yaml || echo "Icon step skipped"
          else
            echo "No logo files found, skipping icon"
          fi

      - name: Analyze (report only)
        working-directory: source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (report only)
        working-directory: source
        run: flutter test

      - name: Raise compileSdk to 36 (app and all plugins)
        working-directory: source
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sdk36.gradle <<'EOF'
          gradle.afterProject { p ->
            def ext = p.extensions.findByName('android')
            if (ext != null) {
              try { ext.compileSdkVersion(36) } catch (Throwable t) { println "sdk36 skipped for ${p.name}: ${t.message}" }
            }
            // Work around an Android Lint runtime crash in image_picker_android's release lint.
            p.tasks.configureEach { task ->
              if (task.name.toLowerCase().startsWith('lintvital')) {
                task.enabled = false
              }
            }
          }
          EOF
          sed -i 's/^          //' ~/.gradle/init.d/sdk36.gradle
          cat ~/.gradle/init.d/sdk36.gradle
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdk = 36/; s/compileSdk(Version)?[ =]+[0-9]+/compileSdk = 36/' "$f"
            fi
          done

      - name: Build APK
        working-directory: source
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopmaster-pro-apk
          path: source/build/app/outputs/flutter-apk/app-release.apk
