name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q shopmaster_pro.zip -d work

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android folder
        working-directory: work/shopmaster_pro
        run: flutter create --platforms=android --project-name shopmaster_pro --org com.shopmaster .

      - name: Get packages
        working-directory: work/shopmaster_pro
        run: flutter pub get

      - name: Apply app icon (optional)
        working-directory: work/shopmaster_pro
        run: |
          if [ -f assets/logo.png ] && [ -f assets/logo_foreground.png ]; then
            flutter pub add --dev flutter_launcher_icons || true
            printf '%s\n' 'flutter_launcher_icons:' '  android: true' '  ios: false' '  image_path: "assets/logo.png"' '  adaptive_icon_background: "#0B1A33"' '  adaptive_icon_foreground: "assets/logo_foreground.png"' > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons -f flutter_launcher_icons.yaml || echo "Icon step skipped"
          else
            echo "No logo files found, skipping icon"
          fi

      - name: Analyze (report only)
        working-directory: work/shopmaster_pro
        run: flutter analyze || true

      - name: Test (report only)
        working-directory: work/shopmaster_pro
        run: flutter test || true

      - name: Build APK
        working-directory: work/shopmaster_pro
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopmaster-pro-apk
          path: work/shopmaster_pro/build/app/outputs/flutter-apk/app-release.apk
